# Aurora's initrd, as alarm-aurora's mkinitcpio HOOKS: the Apple hardware
# modules and the Mac's vendor firmware (asahi-scripts' kernel-modules-asahi
# and asahi-firmware), the USB4 router, the display chain and early KMS, the
# systemd initrd with encrypted root unlock, and Aurora's root conversion
# (aurora-platform's aurora-root, added by the image finalizer and found by
# its check() from then on). Plymouth is added where it is installed.
add_dracutmodules+=" systemd crypt aurora-usb4 aurora-display aurora-early-kms "
compress="zstd"

# The Neural Engine is not needed to mount the root file system. Keep its
# driver out of the initramfs: it boots the ANE firmware in its probe, about
# 1.2 s on the M2, and while that probe runs the initramfs udevd cannot stop
# (fedora-aurora's 90-aurora-ane.conf).
omit_drivers+=" ane_t6021 "

# Debian's dracut adds its busybox module whenever busybox is installed (the
# desktop images pull it in as a recommendation). It installs an applet link
# for every tool it has, before the modules that need the real ones, so
# lsblk and awk became busybox's, and aurora-initrd-root (lsblk -ndo PKNAME)
# failed into emergency mode. Nothing in Aurora's initrd needs busybox.
omit_dracutmodules+=" busybox "
