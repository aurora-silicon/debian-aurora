name: Publish signed installer payload
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [debian-minimal, debian-kde, debian-gnome]
        default: debian-minimal
      image-run:
        description: Successful Debian Aurora images workflow run ID (main branch)
        required: true
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
jobs:
  delivery:
    # aurora-distributions must first accept Debian. At this pin
    # build-payload.yml admits only fedora|arch|nixos-{kde,gnome,minimal} and
    # omarchy-hyprland, maps no distribution to debian-aurora, and checks out
    # an aurora-installer revision whose assemble-distribution-payload.py
    # rejects debian-* profiles. Move the pin to the commit that adds Debian.
    uses: aurora-silicon/aurora-distributions/.github/workflows/build-payload.yml@29deb019a23c45d0b0cadaf29f284c2f8d28d343
    with:
      profile: ${{ inputs.profile }}
      image-run: ${{ inputs.image-run }}
    # The catalog key comes from this repository's catalog-signing
    # environment, which the reusable workflow's signing job runs in.
    secrets:
      INSTALLER_CATALOG_SIGNING_KEY: ${{ secrets.INSTALLER_CATALOG_SIGNING_KEY }}
