name: Publish signed installer payload
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [debian-minimal, debian-kde, debian-gnome]
        default: debian-minimal
      image-run:
        description: Successful Debian Aurora images workflow run ID (main branch)
        required: true
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
jobs:
  delivery:
    # Pinned to aurora-silicon/aurora-distributions#78 (admits debian-* from
    # debian-aurora and selects the post-#191 65-model aurora-installer
    # producer once aurora-distributions/main adopts the 65-model cohort).
    uses: aurora-silicon/aurora-distributions/.github/workflows/build-payload.yml@15e7d1d72004ca8640c0b27d9747cbae684b40b0
    with:
      profile: ${{ inputs.profile }}
      image-run: ${{ inputs.image-run }}
    # The catalog key comes from this repository's catalog-signing
    # environment, which the reusable workflow's signing job runs in.
    secrets:
      INSTALLER_CATALOG_SIGNING_KEY: ${{ secrets.INSTALLER_CATALOG_SIGNING_KEY }}
