name: Deploy Debian Aurora apt repository to GitHub Pages
on:
  # A Release file is valid for seven days (scripts/sign-repository.py), so
  # every served channel is signed again daily; a few missed runs do not
  # expire a channel.
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      testing-tag:
        description: Optional signed snapshot release tag to serve at /testing/ (blank auto-resolves latest)
        default: ''
      nightly-tag:
        description: Optional signed snapshot release tag to serve at /nightly/ (blank auto-resolves latest)
        default: ''
      stable-tag:
        description: Optional signed snapshot release tag to serve at /stable/ (blank auto-resolves latest)
        default: ''
      edge-tag:
        description: Optional signed snapshot release tag to serve at /edge/ (blank auto-resolves latest)
        default: ''
      dry-run:
        description: Verify signatures and assemble site/ without deploying to GitHub Pages
        type: boolean
        default: false
  workflow_call:
    inputs:
      testing-tag:
        type: string
        default: ''
      nightly-tag:
        type: string
        default: ''
      stable-tag:
        type: string
        default: ''
      edge-tag:
        type: string
        default: ''
      dry-run:
        type: boolean
        default: false
permissions: {}
# Only the deploy job takes the debian-aurora-pages concurrency group, so a run
# waiting at approve-stable holds up no other run's signing and deployment.
defaults:
  run:
    shell: bash
jobs:
  # Each channel serves the snapshot its tag names, or its newest release; one
  # that fails falls back to the next release that passes and is reported by
  # the verdict job after the others are deployed. A snapshot has to be signed
  # for its channel and must not be older than the one the channel serves.
  # Stable keeps the snapshot it serves unless stable-tag names another
  # (scripts/stage-channels.py). The staged InRelease files go to the signer.
  stage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.stage.outputs.tags }}
      failed: ${{ steps.stage.outputs.failed }}
      stable-promotion: ${{ steps.stage.outputs.stable-promotion }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: stage
        name: Choose and verify the snapshot of each channel
        env:
          GH_TOKEN: ${{ github.token }}
          TESTING_TAG: ${{ inputs.testing-tag }}
          NIGHTLY_TAG: ${{ inputs.nightly-tag }}
          STABLE_TAG: ${{ inputs.stable-tag }}
          EDGE_TAG: ${{ inputs.edge-tag }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gnupg gpgv >/dev/null
          keyring=$(bash scripts/archive-keyring "$RUNNER_TEMP")
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp \
            | jq 'add // []' > "$RUNNER_TEMP/releases.json"
          # A served channel that cannot be staged stops the run here, before
          # anything is signed or deployed, and the site stays as it is.
          status=0
          python3 scripts/stage-channels.py --releases "$RUNNER_TEMP/releases.json" --keyring "$keyring" \
            --output metadata --testing "$TESTING_TAG" --nightly "$NIGHTLY_TAG" --stable "$STABLE_TAG" \
            --edge "$EDGE_TAG" > "$RUNNER_TEMP/staged.json" || status=$?
          {
            echo '```json'
            jq . "$RUNNER_TEMP/staged.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          (( status == 0 ))
          if [[ $(jq '.tags | length' "$RUNNER_TEMP/staged.json") == 0 ]]; then
            echo "No channel has a snapshot that passes" >&2
            exit 1
          fi
          {
            echo "tags=$(jq -c .tags "$RUNNER_TEMP/staged.json")"
            echo "failed=$(jq -c .failed "$RUNNER_TEMP/staged.json")"
            echo "stable-promotion=$(jq -r '."stable-promotion"' "$RUNNER_TEMP/staged.json")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata
          path: metadata/
          retention-days: 1

  # A Stable snapshot other than the one Stable serves waits for the
  # stable-promotion environment, whose reviewers the repository owners set.
  # Only a run given stable-tag gets here; scheduled and packages.yml runs keep
  # Stable as it is, and do not wait for this one.
  approve-stable:
    needs: stage
    if: ${{ !inputs.dry-run && needs.stage.outputs.stable-promotion == 'true' }}
    runs-on: ubuntu-24.04
    environment: stable-promotion
    permissions: {}
    steps:
      - name: Stable promotion approved
        env:
          TAGS: ${{ needs.stage.outputs.tags }}
        run: jq -r '"Stable serves \(.stable) once this run deploys"' <<<"$TAGS"

  # The signing key is only in the testing-signing environment, and it signs
  # in a container without network. It signs each channel's Release file
  # again with a new Date and Valid-Until; sign-repository.py --refresh
  # changes nothing else and refuses a Release file of another channel.
  refresh:
    needs: [stage, approve-stable]
    if: >-
      ${{ !cancelled() && !inputs.dry-run && needs.stage.result == 'success'
      && (needs.approve-stable.result == 'success' || needs.approve-stable.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: testing-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-metadata
          path: metadata
      - name: Prepare the isolated signer before loading credentials
        run: |
          docker build -t debian-aurora-signer - <<'EOF'
          FROM debian:testing
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                apt-utils gnupg gpgv python3 xz-utils && rm -rf /var/lib/apt/lists/*
          EOF
      - name: Sign each channel's Release file again
        env:
          DEBIAN_SIGNING_KEY: ${{ secrets.DEBIAN_SIGNING_KEY }}
          DEBIAN_SIGNING_PASSPHRASE: ${{ secrets.DEBIAN_SIGNING_PASSPHRASE }}
          TAGS: ${{ needs.stage.outputs.tags }}
        run: |
          set -euo pipefail
          channels=$(jq -r 'keys[]' <<<"$TAGS")
          docker run --rm --network none -e DEBIAN_SIGNING_KEY -e DEBIAN_SIGNING_PASSPHRASE -e CHANNELS="$channels" \
            -v "$PWD:/src" -w /src debian-aurora-signer bash -euo pipefail -c '
              export GNUPGHOME=$(mktemp -d) PYTHONDONTWRITEBYTECODE=1
              printf "%s\n" "$DEBIAN_SIGNING_KEY" | gpg --batch --quiet --import
              for channel in $CHANNELS; do
                python3 scripts/sign-repository.py --production --refresh "metadata/$channel" --channel "$channel" \
                  --output "refreshed/$channel"
              done
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: refreshed-metadata
          path: refreshed/
          retention-days: 1

  # The site is each staged snapshot with its newly signed Release file,
  # checked again: signed for its channel, matching its indexes, fresh, and
  # not older than what the channel serves. A dry run signs nothing and checks
  # the snapshots as they were signed.
  assemble:
    needs: [stage, refresh]
    if: ${{ !cancelled() && needs.stage.result == 'success' && (needs.refresh.result == 'success' || inputs.dry-run) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      snapshots: ${{ steps.assemble.outputs.snapshots }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !inputs.dry-run }}
        with:
          name: refreshed-metadata
          path: refreshed
      - id: assemble
        name: Assemble the apt repository site
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.stage.outputs.tags }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gnupg gpgv >/dev/null
          keyring=$(bash scripts/archive-keyring "$RUNNER_TEMP")
          expected_fpr=$(awk 'NF {print $1; exit}' keys/fingerprint.txt)

          mkdir -p site
          touch site/.nojekyll
          cp packages/aurora-archive-keyring/keys/aurora-debian-archive.asc site/aurora-debian-archive.asc

          index_items=""
          snapshots='{}'
          for channel in $(jq -r 'keys[]' <<<"$TAGS"); do
            tag=$(jq -r --arg channel "$channel" '.[$channel]' <<<"$TAGS")
            [[ $tag =~ ^${channel}-[0-9]{8}\.[0-9]+$ ]]
            work="$RUNNER_TEMP/snap-$channel"
            mkdir -p "$work" "site/$channel"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$work" \
              --pattern debian-aurora-repository.tar
            tar -C "site/$channel" --no-same-owner -xf "$work/debian-aurora-repository.tar"
            rm -rf "$work"
            dists=(site/"$channel"/dists/*)
            (( ${#dists[@]} == 1 ))
            dist=${dists[0]##*/}
            fresh=()
            if [[ $DRY_RUN != true ]]; then
              for file in Release InRelease Release.gpg; do
                cp "refreshed/$channel/dists/$dist/$file" "site/$channel/dists/$dist/$file"
              done
              fresh=(--fresh)
            fi
            python3 scripts/check-repository.py --repository "site/$channel" --channel "$channel" \
              --keyring "$keyring" "${fresh[@]}" --floor > "$RUNNER_TEMP/check-$channel.json"
            index_items+="  <li><a href=\"${channel}/dists/${dist}/InRelease\">${channel}</a> (${tag})</li>"$'\n'
            snapshots=$(jq -c --arg channel "$channel" '. + {($channel): $check[0]."snapshot-date"}' \
              --slurpfile check "$RUNNER_TEMP/check-$channel.json" <<<"$snapshots")
            echo "Staged $channel -> $tag: $(cat "$RUNNER_TEMP/check-$channel.json")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "snapshots=$snapshots" >> "$GITHUB_OUTPUT"

          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>Aurora Debian Archive</title></head>
          <body>
          <h1>Aurora, based on Debian testing — APT Archive</h1>
          <p>Archive signing key (<a href="aurora-debian-archive.asc">aurora-debian-archive.asc</a>): <code>${expected_fpr}</code></p>
          <ul>
          ${index_items}</ul>
          </body>
          </html>
          HTML
          du -sh site site/*
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: ${{ !inputs.dry-run }}
        with:
          path: site

  # One deployment at a time. Another run may have deployed since this one's
  # assemble checked the live channels, so this checks them again first.
  deploy:
    needs: assemble
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    concurrency:
      group: debian-aurora-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check that no channel serves a newer snapshot now
        env:
          SNAPSHOTS: ${{ needs.assemble.outputs.snapshots }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gnupg gpgv >/dev/null
          keyring=$(bash scripts/archive-keyring "$RUNNER_TEMP")
          for channel in $(jq -r 'keys[]' <<<"$SNAPSHOTS"); do
            python3 scripts/check-repository.py --channel "$channel" --keyring "$keyring" --floor \
              --snapshot-date "$(jq -r --arg channel "$channel" '.[$channel]' <<<"$SNAPSHOTS")"
          done
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # A channel whose given tag or newer releases failed was served from an
  # older release, or not at all. That fails the run, after the deployment.
  verdict:
    needs: [stage, assemble, deploy]
    if: ${{ !cancelled() && needs.stage.result == 'success' && needs.stage.outputs.failed != '[]' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Report the releases that failed
        env:
          FAILED: ${{ needs.stage.outputs.failed }}
        run: |
          jq -r '.[]' <<<"$FAILED" >&2
          exit 1
