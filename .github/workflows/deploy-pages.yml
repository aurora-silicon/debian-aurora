name: Deploy Debian Aurora apt repository to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      testing-tag:
        description: Optional signed snapshot release tag to serve at /testing/ (blank auto-resolves latest)
        default: ''
      nightly-tag:
        description: Optional signed snapshot release tag to serve at /nightly/ (blank auto-resolves latest)
        default: ''
      stable-tag:
        description: Optional signed snapshot release tag to serve at /stable/ (blank auto-resolves latest; changes require stable-promotion approval)
        default: ''
      edge-tag:
        description: Optional signed snapshot release tag to serve at /edge/ (blank auto-resolves latest)
        default: ''
      allow-recovery:
        description: Disaster recovery override allowing an older or expired signed snapshot (requires pages-recovery approval; channel binding still enforced)
        type: boolean
        default: false
      recovery-reason:
        description: Required explanation when allow-recovery is true
        default: ''
      dry-run:
        description: Verify signatures and assemble site/ without deploying to GitHub Pages
        type: boolean
        default: false
  workflow_call:
    inputs:
      testing-tag:
        type: string
        default: ''
      nightly-tag:
        type: string
        default: ''
      stable-tag:
        type: string
        default: ''
      edge-tag:
        type: string
        default: ''
      dry-run:
        type: boolean
        default: false
permissions: {}
concurrency:
  group: debian-aurora-pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  assemble:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      stable_changed: ${{ steps.stage.outputs.stable_changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: stage
        name: Verify signed snapshots and assemble apt repository site
        env:
          GH_TOKEN: ${{ github.token }}
          TESTING_TAG: ${{ inputs.testing-tag }}
          NIGHTLY_TAG: ${{ inputs.nightly-tag }}
          STABLE_TAG: ${{ inputs.stable-tag }}
          EDGE_TAG: ${{ inputs.edge-tag }}
          ALLOW_RECOVERY: ${{ inputs.allow-recovery || false }}
          RECOVERY_REASON: ${{ inputs.recovery-reason || '' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gnupg gpgv >/dev/null

          # Verify the checked-in public key matches keys/fingerprint.txt before trusting it.
          expected_fpr=$(awk 'NF {print $1; exit}' keys/fingerprint.txt)
          actual_fpr=$(gpg --show-keys --with-colons packages/aurora-archive-keyring/keys/aurora-debian-archive.asc |
            awk -F: '$1=="fpr" {print $10; exit}')
          if [[ -z $expected_fpr || $actual_fpr != "$expected_fpr" ]]; then
            echo "Archive public key fingerprint ($actual_fpr) does not match keys/fingerprint.txt ($expected_fpr)" >&2
            exit 1
          fi
          keyring="$RUNNER_TEMP/aurora-archive-keyring.gpg"
          gpg --dearmor --output "$keyring" packages/aurora-archive-keyring/keys/aurora-debian-archive.asc

          releases_json="$RUNNER_TEMP/releases.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp \
            | jq 'add // []' > "$releases_json"

          latest_channel_tag() {
            local channel=$1
            jq -r --arg ch "$channel" '
              [ .[]
                | select((.draft | not)
                    and (.tag_name | test("^" + $ch + "-[0-9]{8}\\.[0-9]+$"))
                    and any(.assets[]?; .name == "debian-aurora-repository.tar"))
                | .tag_name
              ]
              | map({
                  tag: .,
                  date: (capture("^" + $ch + "-(?<d>[0-9]{8})\\.(?<n>[0-9]+)$") | .d | tonumber),
                  seq: (capture("^" + $ch + "-(?<d>[0-9]{8})\\.(?<n>[0-9]+)$") | .n | tonumber)
                })
              | sort_by(.date, .seq)
              | last // empty
              | .tag
            ' "$releases_json"
          }

          channels_json="$RUNNER_TEMP/channels.json"
          printf '{}\n' > "$channels_json"

          download_channel() {
            local channel=$1 explicit=$2
            local latest tag
            latest=$(latest_channel_tag "$channel")
            tag=${explicit:-$latest}
            [[ -n $tag ]] || return 0
            if [[ ! $tag =~ ^${channel}-[0-9]{8}\.[0-9]+$ ]]; then
              echo "Invalid release tag for $channel: $tag" >&2
              exit 1
            fi
            local work="$RUNNER_TEMP/snap-$channel"
            mkdir -p "$work"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$work" \
              --pattern debian-aurora-repository.tar
            jq --arg ch "$channel" --arg tag "$tag" --arg latest "${latest:-$tag}" \
               --arg tar "$work/debian-aurora-repository.tar" \
               '.[$ch] = {tag: $tag, latest_tag: $latest, tarball: $tar}' \
               "$channels_json" > "$channels_json.tmp"
            mv "$channels_json.tmp" "$channels_json"
          }

          download_channel testing "$TESTING_TAG"
          download_channel nightly "$NIGHTLY_TAG"
          download_channel stable "$STABLE_TAG"
          download_channel edge "$EDGE_TAG"

          extra_args=()
          if [[ $ALLOW_RECOVERY == true ]]; then
            extra_args+=(--allow-recovery --recovery-reason "$RECOVERY_REASON")
          fi

          python3 scripts/stage-pages.py \
            --keyring "$keyring" \
            --fingerprint "$expected_fpr" \
            --site site \
            --asc packages/aurora-archive-keyring/keys/aurora-debian-archive.asc \
            --channels-json "$channels_json" \
            --live-base-url https://aurorasilicon.org/debian-aurora \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            "${extra_args[@]}"
          du -sh site site/*
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: ${{ !inputs.dry-run }}
        with:
          path: site

  # Stable channel promotions require approval on the stable-promotion
  # environment (configured with required reviewers by repository owners).
  approve-stable:
    needs: assemble
    if: ${{ !inputs.dry-run && needs.assemble.outputs.stable_changed == 'true' }}
    runs-on: ubuntu-24.04
    environment: stable-promotion
    steps:
      - name: Record Stable channel promotion approval
        run: echo "Stable channel deployment approved"

  # Disaster recovery deploys (older or expired snapshots) require approval on
  # the pages-recovery environment.
  approve-recovery:
    needs: assemble
    if: ${{ !inputs.dry-run && inputs.allow-recovery }}
    runs-on: ubuntu-24.04
    environment: pages-recovery
    steps:
      - name: Record disaster recovery approval
        run: echo "Disaster recovery deployment approved"

  deploy:
    needs: [assemble, approve-stable, approve-recovery]
    if: ${{ !inputs.dry-run && !cancelled() && !failure() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
